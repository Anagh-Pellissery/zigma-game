<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>All-in Put</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#25292a;--cream:#dad6ae;--red:#cc4527;--mut:#9a9985;--line:#4a4f4f;--card:#2d3233}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:16px 'Space Grotesk',system-ui,sans-serif}
.mono{font-family:'Space Mono',monospace;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.red{color:var(--red)}.mut{color:var(--mut)}
nav{display:flex;align-items:stretch;border-bottom:1px solid var(--line);height:56px;position:sticky;top:0;background:var(--bg);z-index:5}
nav>*{display:flex;align-items:center;padding:0 22px;border-right:1px solid var(--line);color:var(--cream);background:none;border-top:0;border-bottom:0;border-left:0;font:inherit;cursor:pointer;text-decoration:none}
nav .brand{font-weight:700;font-size:18px;gap:10px}nav .dot{width:16px;height:16px;border-radius:50%;background:var(--red)}
nav .on{background:var(--cream);color:var(--bg)}nav .sp{flex:1;border-right:0;cursor:default}nav .sp+*{border-left:1px solid var(--line);border-right:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.btn{background:var(--cream);color:var(--bg);border:1px solid var(--cream);padding:14px 26px;font:500 17px 'Space Grotesk';cursor:pointer}
.btn.o{background:none;color:var(--cream)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.sm{padding:8px 14px;font-size:14px}.btn.r{background:var(--red);border-color:var(--red);color:#fff}
input,select{background:var(--bg);border:1px solid var(--line);color:var(--cream);padding:11px 12px;font:inherit;width:100%;border-radius:0}input:focus,select:focus{outline:1px solid var(--cream)}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;padding:50px 0 30px}
.hero img.logo{width:min(480px,90%)}.hero h1{font-size:clamp(44px,7vw,86px);margin:14px 0;line-height:1;letter-spacing:-.03em}
.hero img.car{width:100%;max-width:520px;justify-self:end}
.login{display:grid;gap:12px;max-width:380px;margin-top:22px}
.strip{background:var(--cream);color:var(--bg);overflow:hidden;white-space:nowrap;padding:20px 0;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.1em;font-size:14px}
.strip div{display:inline-block;animation:mq 30s linear infinite}.strip span{margin:0 36px}.strip b{color:var(--red)}
@keyframes mq{to{transform:translateX(-50%)}}
.bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border-bottom:1px solid var(--line)}
.bar>div{padding:22px;border-right:1px solid var(--line)}.bar .big{font-size:38px;font-weight:500;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin:20px 0 50px}
.card{background:var(--card);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:21px}.price{font-size:38px;font-weight:700}.card .row{display:flex;gap:8px}.card input{width:80px}
.tag{display:inline-block;padding:4px 10px;border:1px solid var(--red);color:var(--red)}.tag.d{background:var(--red);color:#fff}.tag.sm{padding:2px 6px;font-size:11px}
.tabs{display:flex;gap:0;margin:26px 0 0;border-bottom:1px solid var(--line)}.tabs button{background:none;border:0;color:var(--mut);padding:14px 24px;font:inherit;cursor:pointer}.tabs .on{color:var(--cream);border-bottom:2px solid var(--red)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font:400 12px 'Space Mono';text-transform:uppercase;letter-spacing:.1em}td input{padding:7px}
h2{font-size:30px;margin:36px 0 12px}.panel{border:1px solid var(--line);background:var(--card);padding:20px;margin-bottom:20px}
.flex{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.flex>label{display:grid;gap:5px;flex:1;min-width:130px}
.clock{font:700 clamp(60px,9vw,120px) 'Space Mono';letter-spacing:-.04em;line-height:1}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;padding:12px 22px;z-index:9;display:none}
.disp .grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}.disp .price{font-size:56px}.disp .card h3{font-size:26px}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-content{background:var(--card);border:1px solid var(--line);max-width:850px;width:100%;max-height:85vh;overflow-y:auto;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,0.6);display:flex;flex-direction:column;gap:16px}
.modal-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}
.modal-header h2{margin:0;font-size:24px}
.close-btn{background:none;border:none;color:var(--cream);font-size:24px;cursor:pointer;padding:0 8px;line-height:1}
.close-btn:hover{color:var(--red)}
.stat-box{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:4px 0}
.stat-card{background:var(--bg);border:1px solid var(--line);padding:14px;border-radius:2px}
.stat-card .val{font-size:24px;font-weight:700;margin-top:4px}
.inv-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.inv-tag{background:var(--bg);border:1px solid var(--line);padding:6px 12px;font-size:14px;display:flex;align-items:center;gap:6px}
.inv-tag b{color:var(--red)}
@media(max-width:800px){.hero{grid-template-columns:1fr}.hero img.car{justify-self:center}nav>*{padding:0 12px}}
</style></head><body><div id="app"></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
let tok=localStorage.tok||'',role=localStorage.role||'',pub=null,off=0,lastV=-1,me=null,adm=null,tab='shop',activeModalTeam=null,selectedAdminFilter='all';
const fmt=n=>'₹'+Number(n).toLocaleString('en-IN');
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2800)};
async function api(p,b){const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'content-type':'application/json','x-token':tok},body:b?JSON.stringify(b):undefined});
 const j=await r.json();if(!r.ok){if(r.status===401&&p!=='login')logout(true);throw new Error(j.error||'Error')}return j}
function logout(q){tok=role='';localStorage.clear();me=adm=null;if(!q)toast('Logged out');location.hash='#/';render()}
const route=()=>(location.hash.replace('#/','')||'home');
const now=()=>Date.now()+off;
function ph(){if(!pub||!pub.startedAt)return{p:'idle',left:pub?pub.baseMs:0};const e=now()-pub.startedAt;return e<pub.baseMs?{p:'base',left:pub.baseMs-e}:{p:'double',left:0}}
const priceOf=b=>ph().p==='double'?b*pub.mult:b;
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const PH={idle:['Shop opens soon','Waiting for start'],base:['Base price','Base price window'],double:['2× price','Double price now']};
function tick(){if(!pub)return;const {p,left}=ph();
 document.querySelectorAll('[data-clock]').forEach(e=>e.textContent=p==='idle'?mmss(pub.baseMs):mmss(left));
 document.querySelectorAll('[data-phase]').forEach(e=>{e.textContent=p==='double'?'Double price — '+pub.mult+'×':p==='base'?'Base price window':'Not started';e.classList.toggle('d',p==='double')});
 document.querySelectorAll('[data-base]').forEach(e=>e.textContent=fmt(priceOf(+e.dataset.base)));
 const lock=p==='idle';document.querySelectorAll('.buy').forEach(b=>{if(!b.dataset.out)b.disabled=lock})}
const strip=()=>`<div class="strip"><div>${['Every credit counts','<b>●</b> Going once','Going twice','<b>Sold!</b>','Spend wisely'].map(x=>`<span>${x}</span>`).join('').repeat(8)}</div></div>`;
const nav=(items,active)=>`<nav><a class="brand" href="#/"><i class="dot"></i>All-in Put</a>${items.map(([k,l])=>`<a class="${active===k?'on':''}" href="#/${k}">${l}</a>`).join('')}<span class="sp"></span>${tok?`<span class="mono mut">${role==='admin'?'Admin':me?me.u:''}</span><button onclick="logout()">Log out</button>`:''}</nav>`;
const clockBar=()=>`<div class="bar"><div><div class="big mono" data-clock>--:--</div><div class="mut">until prices double</div></div><div><div class="big" style="font-size:24px;padding-top:10px"><span class="tag mono" data-phase>…</span></div></div></div>`;

function home(){return `<nav><a class="brand" href="#/"><i class="dot"></i>All-in Put</a></nav><div class="wrap"><div class="hero"><div>
<img class="logo" src="logo.png" alt="All-in Put"><div class="mono red" style="margin-top:14px">Team-based electronics &amp; innovation event</div>
<h1>Bid. Build. <span class="red">Win.</span></h1><p class="mut" style="font-size:19px;max-width:440px">Bid for components with virtual credits. Build a working project with only what you win.</p>
<form class="login" onsubmit="doLogin(event)"><input id="u" placeholder="Team name" autocomplete="username" required><input id="p" type="password" placeholder="Password" autocomplete="current-password" required><button class="btn">Enter the auction →</button></form></div>
<img class="car" src="car.png" alt=""></div></div>${strip()}`}
async function doLogin(e){e.preventDefault();try{const j=await api('login',{username:$('#u').value,password:$('#p').value});tok=j.token;role=j.role;localStorage.tok=tok;localStorage.role=role;lastV=-1;await load();location.hash=role==='admin'?'#/admin':'#/shop'}catch(x){toast(x.message)}}

function shop(){if(!pub)return'';const c=pub.components;
 return `${nav([['shop','Shop']],'shop')}<div class="wrap">${clockBar()}
 <div class="tabs"><button class="${tab==='shop'?'on':''}" onclick="tab='shop';render()">Shop</button><button class="${tab==='bid'?'on':''}" onclick="tab='bid';render()">Bid</button><button class="${tab==='kit'?'on':''}" onclick="tab='kit';render()">My kit</button>
 <span style="flex:1"></span><span style="padding:14px 0" class="mono">Credits <b class="red" style="font-size:18px">${me?fmt(me.credits):'…'}</b></span></div>
 ${tab==='shop'?`<div class="grid">${c.map(x=>`<div class="card"><h3>${x.name}</h3><div class="price" data-base="${x.base}">${fmt(x.base)}</div><div class="mono mut">per unit</div>
 <div class="row"><input type="number" min="1" value="1" id="q_${x.id}" ${x.soldOut?'disabled':''}><button class="btn sm buy" ${x.soldOut?'data-out="1" disabled':''} onclick="buy('${x.id}')">${x.soldOut?'Sold out':'Buy'}</button></div></div>`).join('')}</div>`
 :tab==='bid'?`<div class="panel" style="margin-top:24px"><div class="mono red">// Bidding</div><h2 style="margin:8px 0">Coming soon</h2><p class="mut">The auction round will open here once the organisers set it up.</p></div>`
 :`<div class="panel" style="margin-top:24px"><div class="mono red">// What you own</div>${me&&Object.keys(me.inv).length?`<table><tr><th>Component</th><th>Qty</th></tr>${pub.components.filter(x=>me.inv[x.id]).map(x=>`<tr><td>${x.name}</td><td>${me.inv[x.id]}</td></tr>`).join('')}</table>`:'<p class="mut">Nothing yet — head to the shop.</p>'}</div>`}</div>`}
async function buy(id){const q=+$('#q_'+id).value;try{me=await api('buy',{id,qty:q});toast('Purchased ×'+q);render()}catch(e){toast(e.message)}}

const openTeamModal=u=>{activeModalTeam=u;render()};
const closeTeamModal=()=>{activeModalTeam=null;render()};

function renderModal(){
 if(!activeModalTeam||!adm||role!=='admin')return'';
 const tObj=adm.teams.find(t=>t.u===activeModalTeam);
 if(!tObj)return'';
 const tOrders=adm.orders.filter(o=>o.team===activeModalTeam);
 const totalSpent=tOrders.reduce((sum,o)=>sum+(o.total||0),0);
 return `<div class="modal-overlay" onclick="if(event.target===this)closeTeamModal()">
 <div class="modal-content">
  <div class="modal-header">
   <div>
    <div class="mono red">// Individual Team Dashboard</div>
    <h2 style="margin:4px 0 0">${tObj.u}</h2>
   </div>
   <button class="close-btn" onclick="closeTeamModal()">✕</button>
  </div>
  <div class="stat-box">
   <div class="stat-card"><div class="mono mut">Current Balance</div><div class="val red">${fmt(tObj.credits)}</div></div>
   <div class="stat-card"><div class="mono mut">Total Spent</div><div class="val">${fmt(totalSpent)}</div></div>
   <div class="stat-card"><div class="mono mut">Orders Placed</div><div class="val">${tOrders.length}</div></div>
  </div>
  <div style="border-top:1px solid var(--line);padding-top:14px">
   <div class="mono mut" style="margin-bottom:8px">Inventory Owned</div>
   ${Object.keys(tObj.inv||{}).filter(k=>tObj.inv[k]>0).length?`
    <div class="inv-tags">
     ${Object.entries(tObj.inv).filter(([_,q])=>q>0).map(([id,q])=>{
      const comp=pub?pub.components.find(c=>c.id===id):null;
      return `<div class="inv-tag"><span>${comp?comp.name:id}</span><b>×${q}</b></div>`;
     }).join('')}
    </div>
   `:'<p class="mut" style="margin:4px 0">No components owned yet.</p>'}
  </div>
  <div style="border-top:1px solid var(--line);padding-top:14px">
   <div class="mono mut" style="margin-bottom:8px">Individual Logs (${tOrders.length})</div>
   <table>
    <tr><th>Time</th><th>Item</th><th>Qty</th><th>Total</th><th>Tier</th></tr>
    ${tOrders.map(o=>`<tr>
     <td>${new Date(o.t).toLocaleTimeString()}</td>
     <td>${o.item}</td>
     <td>${o.qty}</td>
     <td>${fmt(o.total)}</td>
     <td><span class="tag ${o.phase==='double'?'d':''}">${o.phase==='double'?'2×':'base'}</span></td>
    </tr>`).join('')||'<tr><td class="mut" colspan="5">No individual orders yet for this team.</td></tr>'}
   </table>
  </div>
  <div style="display:flex;justify-content:flex-end;margin-top:8px">
   <button class="btn sm o" onclick="closeTeamModal()">Close</button>
  </div>
 </div>
</div>`}

function admin(){if(!adm||!pub)return nav([],'')+'<div class="wrap"><p>Loading…</p></div>';const A=adm;
 const filteredOrders=selectedAdminFilter==='all'?A.orders:A.orders.filter(o=>o.team===selectedAdminFilter);
 return `${nav([['admin','Admin'],['display','Display ↗']],'admin')}<div class="wrap">
 <h2>Timer</h2><div class="panel"><div class="flex"><div><div class="clock" data-clock>--:--</div><span class="tag mono" data-phase>…</span></div>
 <label>Base-price minutes<input id="bm" type="number" min="1" value="${A.timer.baseMin}"></label>
 <button class="btn r" onclick="timer('start')">▶ Start</button><button class="btn o" onclick="if(confirm('Reset the timer? The shop will lock.'))timer('reset')">Reset</button><button class="btn o" onclick="timer('')">Save minutes</button></div></div>
 <div class="panel"><div class="flex"><label>Price multiplier after timer (×)<input id="mu" type="number" step="0.1" value="${A.mult}"></label><label>Default starting credits<input id="dc" type="number" value="${A.defaultCredits}"></label><button class="btn o" onclick="settings()">Save settings</button><button class="btn sm r" onclick="resetAll()" style="margin-left:auto;height:44px;align-self:end">⚠️ Reset All Event Data</button></div></div>
 <h2>Inventory &amp; prices</h2><div class="panel"><table><tr><th>Component</th><th>Stock left</th><th>Base price</th><th>Selling now</th></tr>
 ${A.components.map(c=>`<tr data-id="${c.id}"><td><input class="n" value="${c.name}"></td><td><input class="qty" type="number" value="${c.qty}"></td><td><input class="pr" type="number" value="${c.price}"></td><td class="price" style="font-size:20px" data-base="${c.price}"></td></tr>`).join('')}</table>
 <p><button class="btn" onclick="saveComps()">Save inventory</button></p></div>
 <h2>Teams Leaderboard</h2><div class="panel"><div class="flex"><label>Team name<input id="tn"></label><label>Password<input id="tp"></label><label>Credits (optional)<input id="tc" type="number" placeholder="${A.defaultCredits}"></label><button class="btn" onclick="addTeam()">Add team</button></div></div>
 <div class="panel"><table><tr><th>Team</th><th>Password</th><th>Balance</th><th>Logs</th><th>Actions</th></tr>${A.teams.map(t=>{
  const tCount=A.orders.filter(o=>o.team===t.u).length;
  return `<tr data-t="${t.u}"><td><b style="font-size:16px">${t.u}</b></td><td><input class="tp" placeholder="${t.p}" style="max-width:140px"></td><td><input class="tc" type="number" value="${t.credits}" style="max-width:120px"></td><td><button class="btn sm o" onclick="openTeamModal('${t.u}')" style="display:inline-flex;align-items:center;gap:6px"><span>📋 View Logs</span><span class="tag sm">${tCount}</span></button></td><td><button class="btn sm o" onclick="editTeam(this)">Update</button> <button class="btn sm o" onclick="delTeam(this)">Delete</button></td></tr>`;
 }).join('')||'<tr><td class="mut" colspan="5">No teams yet</td></tr>'}</table><p class="mut">Password box shows current password as placeholder. Click "View Logs" to view individual logs &amp; balance for that team.</p></div>
 <div style="display:flex;justify-content:space-between;align-items:center;margin:36px 0 12px;flex-wrap:wrap;gap:10px"><h2 style="margin:0">Recent orders</h2><div style="display:flex;align-items:center;gap:10px"><span class="mono mut">Filter by Team:</span><select id="teamFilter" style="max-width:220px" onchange="selectedAdminFilter=this.value;render()"><option value="all" ${selectedAdminFilter==='all'?'selected':''}>All Teams (${A.orders.length})</option>${A.teams.map(t=>`<option value="${t.u}" ${selectedAdminFilter===t.u?'selected':''}>${t.u} (${A.orders.filter(o=>o.team===t.u).length})</option>`).join('')}</select><button class="btn sm o" onclick="resetOrders()" style="border-color:var(--red);color:var(--red)"> Clear Orders</button></div></div>
 <div class="panel"><table><tr><th>Time</th><th>Team</th><th>Item</th><th>Qty</th><th>Total</th><th>Tier</th></tr>${filteredOrders.slice(0,50).map(o=>`<tr><td>${new Date(o.t).toLocaleTimeString()}</td><td><a href="javascript:void(0)" onclick="openTeamModal('${o.team}')" style="color:var(--cream);font-weight:bold;text-decoration:underline">${o.team}</a></td><td>${o.item}</td><td>${o.qty}</td><td>${fmt(o.total)}</td><td>${o.phase==='double'?'2×':'base'}</td></tr>`).join('')||'<tr><td class="mut" colspan="6">No orders found</td></tr>'}</table></div></div>`}
const post=async(p,b,m)=>{try{await api(p,b);if(m)toast(m);await load()}catch(e){toast(e.message)}};
const timer=a=>post('admin/timer',{action:a,baseMin:$('#bm').value},a==='start'?'Timer started':'Saved');
const settings=()=>post('admin/settings',{mult:$('#mu').value,defaultCredits:$('#dc').value},'Saved');
const saveComps=()=>post('admin/components',{list:[...document.querySelectorAll('tr[data-id]')].map(r=>({id:r.dataset.id,name:r.querySelector('.n').value,qty:r.querySelector('.qty').value,price:r.querySelector('.pr').value}))},'Inventory saved');
const addTeam=()=>post('admin/team-add',{u:$('#tn').value,p:$('#tp').value,credits:$('#tc').value},'Team added');
const editTeam=b=>{const r=b.closest('tr');post('admin/team-edit',{u:r.dataset.t,p:r.querySelector('.tp').value,credits:r.querySelector('.tc').value},'Updated')};
const delTeam=b=>{const u=b.closest('tr').dataset.t;if(confirm('Delete team '+u+'?'))post('admin/team-del',{u})};
const resetOrders=()=>{if(confirm('Clear all recent order logs?'))post('admin/reset-orders',{},'Order logs cleared')};
const resetAll=()=>{if(confirm('RESET ALL EVENT DATA?\n\nThis will:\n• Clear all order logs\n• Reset all team credits to default\n• Clear all team inventories\n• Stop and reset the timer'))post('admin/reset-all',{},'All event data reset')};

function display(){if(!pub)return'';
 return `<div class="disp"><nav><span class="brand"><i class="dot"></i>All-in Put</span><span class="sp"></span><span class="mono mut" style="border:0">Live shop board</span></nav><div class="wrap">
 <div style="display:flex;gap:40px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:30px 0 10px"><div><div class="mono mut">Prices ${ph().p==='double'?'are now doubled':'double in'}</div><div class="clock" data-clock>--:--</div><span class="tag mono" data-phase>…</span></div><img src="logo.png" style="width:min(420px,100%)"></div>
 <div class="grid">${pub.components.map(x=>`<div class="card"><h3>${x.name}</h3><div class="price" data-base="${x.base}">${fmt(x.base)}</div><div class="mono ${x.soldOut?'red':'mut'}">${x.soldOut?'Sold out':'per unit'}</div></div>`).join('')}</div></div>${strip()}</div>`}

function render(){const r=route();
 if(r==='display')app.innerHTML=display();
 else if(r==='admin')app.innerHTML=(role==='admin'?admin():home())+renderModal();
 else if(r==='shop'&&role==='team')app.innerHTML=shop();
 else if(tok&&r==='home')location.hash=role==='admin'?'#/admin':'#/shop';
 else app.innerHTML=home();
 tick()}
async function load(){if(tok&&role==='admin')adm=await api('admin/state').catch(()=>null);else if(tok&&role==='team')me=await api('me').catch(()=>null);render()}
function connect(){const es=new EventSource('/api/stream');es.onmessage=async e=>{pub=JSON.parse(e.data);off=pub.now-Date.now();
 if(pub.v!==lastV){lastV=pub.v;const a=document.activeElement;if(!(a&&(a.tagName==='INPUT'||a.tagName==='SELECT')&&route()==='admin'))await load();else tick()}else tick()}}
addEventListener('hashchange',()=>{render();if(route()==='admin'||route()==='shop')load()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&activeModalTeam)closeTeamModal()});
setInterval(tick,250);connect();
</script></body></html>
